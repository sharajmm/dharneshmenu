<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Streets of Kovai — Prep Checklist</title>
<style>
  :root {
    --bg: #fbf3e7;
    --card: #fffdf9;
    --ink: #3a2417;
    --muted: #8a7360;
    --terracotta: #c1502e;
    --terracotta-dark: #7a3b28;
    --gold: #e0a244;
    --cream: #f3e3d0;
    --line: #ecd9c2;
    --avail-bg: #eef6ee;
    --avail-ink: #3f7a45;
    --need-bg: #fdeeee;
    --need-ink: #b3402f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 0 0 24px 0;
  }
  .hero {
    background: linear-gradient(180deg, var(--terracotta-dark) 0%, var(--terracotta) 100%);
    padding: 22px 16px 26px 16px;
    text-align: center;
    border-bottom: 4px solid var(--gold);
    border-radius: 0 0 22px 22px;
    box-shadow: 0 4px 14px rgba(122, 59, 40, 0.25);
  }
  .logo {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    background: #fff;
    object-fit: cover;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .brand-title {
    color: #fff;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 1px;
    margin: 10px 0 2px 0;
    text-transform: uppercase;
    font-family: Georgia, "Times New Roman", serif;
  }
  .brand-sub {
    color: var(--cream);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .hero::after {
    content: "";
    display: block;
    width: 60px;
    height: 2px;
    background: var(--gold);
    margin: 10px auto 0 auto;
  }
  main.content {
    padding: 16px;
    max-width: 640px;
    margin: 0 auto;
  }
  .progress-text {
    font-size: 12px;
    color: var(--muted);
    margin: 14px 0 10px 0;
    text-align: center;
    font-weight: 600;
  }
  .toolbar { display: flex; gap: 8px; margin-bottom: 6px; }
  button.tool {
    flex: 1;
    padding: 11px 6px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
  }
  button.tool.primary {
    background: var(--terracotta);
    color: #fff;
    border-color: var(--terracotta-dark);
  }
  button.tool:active { opacity: 0.85; }
  .status {
    font-size: 12px;
    color: var(--terracotta-dark);
    min-height: 16px;
    margin: 4px 0 4px 0;
    text-align: center;
    font-weight: 600;
  }
  section.category {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin: 14px 0;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(122, 59, 40, 0.06);
  }
  .cat-header {
    padding: 11px 14px;
    font-weight: 800;
    font-size: 13.5px;
    background: var(--cream);
    color: var(--terracotta-dark);
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.item {
    display: flex;
    align-items: center;
    padding: 11px 14px;
    border-top: 1px solid var(--line);
    gap: 8px;
  }
  li.item:first-child { border-top: none; }
  label.item-name { font-size: 14.5px; flex: 1; line-height: 1.3; }
  .toggle-group { display: flex; gap: 6px; flex-shrink: 0; }
  .toggle-btn {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    min-width: 66px;
  }
  .toggle-btn.avail.active {
    background: var(--avail-bg);
    color: var(--avail-ink);
    border-color: var(--avail-ink);
  }
  .toggle-btn.need.active {
    background: var(--need-bg);
    color: var(--need-ink);
    border-color: var(--need-ink);
  }
  .note {
    font-size: 11px;
    color: var(--muted);
    margin: 18px 0 0 0;
    padding: 0 2px;
    text-align: center;
  }
  footer.brand-footer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 26px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  #imageResult { display: none; margin-top: 16px; }
  #imageResult.show { display: block; }
  #resultImg {
    width: 100%;
    border-radius: 12px;
    border: 1px solid var(--line);
    display: block;
    box-shadow: 0 2px 10px rgba(122, 59, 40, 0.1);
  }
  .save-hint {
    background: var(--cream);
    color: var(--terracotta-dark);
    font-size: 13px;
    font-weight: 700;
    padding: 10px 12px;
    border-radius: 8px;
    margin: 10px 0;
    text-align: center;
  }
  .notes-block {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin: 16px 0;
    box-shadow: 0 1px 4px rgba(122, 59, 40, 0.06);
  }
  .notes-label {
    font-weight: 800;
    font-size: 13.5px;
    color: var(--terracotta-dark);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 8px;
    display: block;
  }
  #notesInput {
    width: 100%;
    min-height: 90px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background: #fffdf9;
    resize: vertical;
  }
  #notesInput:focus {
    outline: none;
    border-color: var(--terracotta);
  }
</style>
</head>

      "Curry leaves"
    ]
  },
  {
    category: "Dishes To Prep",
    items: [
      "Chicken biryani",
      "Mutton biryani",
      "Veg biryani",
      "Iddly",
      "Idiyappam",
      "Fish fry",
      "Mutton kola"
    ]
  },
  {
    category: "Rice, Flours & Onions",
    items: [
      "White onion",
      "Red onion",
      "Thali rice",
      "White rice",
      "All purpose flour",
      "Rice flour",
      "Corn flour",
      "Potato",
      "Mango pulp"
    ]
  }
];

const status = {};

function slug(ci, ii) { return "c" + ci + "-i" + ii; }

function buildList() {
  const container = document.getElementById("listContainer");
  container.innerHTML = "";
  DATA.forEach((cat, ci) => {
    const section = document.createElement("section");
    section.className = "category";

    const header = document.createElement("div");
    header.className = "cat-header";
    header.textContent = cat.category;
    section.appendChild(header);

    const ul = document.createElement("ul");
    ul.className = "items";

    cat.items.forEach((itemText, ii) => {
      const id = slug(ci, ii);
      const li = document.createElement("li");
      li.className = "item";

      const label = document.createElement("label");
      label.className = "item-name";
      label.textContent = itemText;

      const group = document.createElement("div");
      group.className = "toggle-group";

      const availBtn = document.createElement("button");
      availBtn.className = "toggle-btn avail";
      availBtn.textContent = "Available";
      availBtn.id = "avail-" + id;
      availBtn.addEventListener("click", () => setStatus(id, "available"));

      const needBtn = document.createElement("button");
      needBtn.className = "toggle-btn need";
      needBtn.textContent = "Needed";
      needBtn.id = "need-" + id;
      needBtn.addEventListener("click", () => setStatus(id, "needed"));

      group.appendChild(availBtn);
      group.appendChild(needBtn);
      li.appendChild(label);
      li.appendChild(group);
      ul.appendChild(li);
    });

    section.appendChild(ul);
    container.appendChild(section);
  });
}

function setStatus(id, value) {
  status[id] = (status[id] === value) ? undefined : value;
  const availBtn = document.getElementById("avail-" + id);
  const needBtn = document.getElementById("need-" + id);
  availBtn.classList.toggle("active", status[id] === "available");
  needBtn.classList.toggle("active", status[id] === "needed");
  updateProgress();
}

function updateProgress() {
  let total = 0, marked = 0;
  DATA.forEach(cat => { total += cat.items.length; });
  Object.values(status).forEach(v => { if (v) marked++; });
  document.getElementById("progressText").textContent = marked + " / " + total + " marked";
}

document.getElementById("resetBtn").addEventListener("click", () => {
  Object.keys(status).forEach(k => delete status[k]);
  document.querySelectorAll(".toggle-btn").forEach(b => b.classList.remove("active"));
  updateProgress();
});

let currentBlob = null;

function groupByStatus() {
  const availableItems = [];
  const neededItems = [];
  const unmarkedItems = [];
  DATA.forEach((cat, ci) => {
    cat.items.forEach((itemText, ii) => {
      const id = slug(ci, ii);
      const s = status[id];
      if (s === "available") availableItems.push(itemText);
      else if (s === "needed") neededItems.push(itemText);
      else unmarkedItems.push(itemText);
    });
  });
  return { availableItems, neededItems, unmarkedItems };
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let current = "";
  words.forEach((word) => {
    const test = current ? current + " " + word : word;
    if (ctx.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  });
  if (current) lines.push(current);
  return lines;
}

function drawChecklistImage() {
  const { neededItems } = groupByStatus();
  const noteText = document.getElementById("notesInput").value.trim();

  const scale = 2;
  const width = 720;
  const paddingX = 34;
  const lineHeight = 24;
  const sectionHeaderHeight = 40;
  const sectionGap = 22;
  const logoSize = 64;
  const topHeight = 130;
  const bottomPad = 40;
  const maxTextWidth = width - paddingX * 2 - 8;

  // measure note lines ahead of time using a scratch canvas
  const scratchCanvas = document.createElement("canvas");
  const scratchCtx = scratchCanvas.getContext("2d");
  scratchCtx.font = "bold 14px -apple-system, Helvetica, Arial, sans-serif";
  const noteLines = noteText ? wrapText(scratchCtx, noteText, maxTextWidth) : [];

  const neededSectionHeight = sectionHeaderHeight + Math.max(neededItems.length, 1) * lineHeight + sectionGap;
  const notesSectionHeight = sectionHeaderHeight + Math.max(noteLines.length, 1) * lineHeight + sectionGap;

  const height = topHeight + neededSectionHeight + notesSectionHeight + bottomPad;

  const canvas = document.createElement("canvas");
  canvas.width = width * scale;
  canvas.height = height * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  // white background
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, width, height);

  // header band
  ctx.fillStyle = "#7a3b28";
  ctx.fillRect(0, 0, width, topHeight - 20);

  // logo circle
  const logoEl = document.querySelector(".logo");
  const logoX = width / 2 - logoSize / 2;
  const logoY = 14;
  try {
    ctx.save();
    ctx.beginPath();
    ctx.arc(width / 2, logoY + logoSize / 2, logoSize / 2, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.clip();
    ctx.drawImage(logoEl, logoX, logoY, logoSize, logoSize);
    ctx.restore();
    ctx.strokeStyle = "#e0a244";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(width / 2, logoY + logoSize / 2, logoSize / 2, 0, Math.PI * 2);
    ctx.stroke();
  } catch (e) {
    // if logo can't be drawn (e.g. not decoded yet), skip silently
  }

  let y = topHeight;

  ctx.fillStyle = "#3a2417";
  ctx.textAlign = "center";
  ctx.font = "bold 20px -apple-system, Helvetica, Arial, sans-serif";
  ctx.fillText("Streets of Kovai — Needed Items", width / 2, y);
  y += 20;
  ctx.fillStyle = "#8a7360";
  ctx.font = "bold 12px -apple-system, Helvetica, Arial, sans-serif";
  const dateStr = new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
  ctx.fillText(dateStr, width / 2, y);
  ctx.textAlign = "left";

  y += 26;

  function renderHeader(title, count, accentHex) {
    ctx.fillStyle = accentHex;
    ctx.font = "bold 16px -apple-system, Helvetica, Arial, sans-serif";
    const suffix = (count !== null) ? "  (" + count + " item" + (count === 1 ? "" : "s") + ")" : "";
    ctx.fillText(title + suffix, paddingX, y);
    y += 8;
    ctx.strokeStyle = accentHex;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(paddingX, y);
    ctx.lineTo(width - paddingX, y);
    ctx.stroke();
    y += 22;
  }

  // Needed section
  renderHeader("Needed / Required", neededItems.length, "#b3402f");
  if (neededItems.length === 0) {
    ctx.fillStyle = "#a89e93";
    ctx.font = "bold italic 13px -apple-system, Helvetica, Arial, sans-serif";
    ctx.fillText("None", paddingX, y);
    y += lineHeight;
  } else {
    ctx.fillStyle = "#2b2320";
    ctx.font = "bold 14px -apple-system, Helvetica, Arial, sans-serif";
    neededItems.forEach((itemText) => {
      ctx.fillText("• " + itemText, paddingX + 4, y);
      y += lineHeight;
    });
  }
  y += sectionGap - 10;

  // Notes section
  renderHeader("Additional Notes", null, "#7a3b28");
  if (noteLines.length === 0) {
    ctx.fillStyle = "#a89e93";
    ctx.font = "bold italic 13px -apple-system, Helvetica, Arial, sans-serif";
    ctx.fillText("None", paddingX, y);
    y += lineHeight;
  } else {
    ctx.fillStyle = "#2b2320";
    ctx.font = "bold 14px -apple-system, Helvetica, Arial, sans-serif";
    noteLines.forEach((line) => {
      ctx.fillText(line, paddingX, y);
      y += lineHeight;
    });
  }

  return canvas;
}

function handleGenerate() {
  const statusEl = document.getElementById("statusMsg");
  try {
    const canvas = drawChecklistImage();
    const dataUrl = canvas.toDataURL("image/png");
    document.getElementById("resultImg").src = dataUrl;
    document.getElementById("imageResult").classList.add("show");
    document.getElementById("imageResult").scrollIntoView({ behavior: "smooth", block: "start" });

    canvas.toBlob((blob) => { currentBlob = blob; }, "image/png");

    statusEl.textContent = "Image ready below.";
    setTimeout(() => { statusEl.textContent = ""; }, 2000);
  } catch (e) {
    statusEl.textContent = "Couldn't generate the image — try again.";
  }
}

async function handleShare() {
  const statusEl = document.getElementById("statusMsg");
  if (!currentBlob) {
    statusEl.textContent = "Generate the image first.";
    return;
  }
  const fileName = "streets-of-kovai-prep-checklist.png";

  try {
    const file = new File([currentBlob], fileName, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Streets of Kovai — Prep Checklist" });
      statusEl.textContent = "Choose \"Save Image\" in the share sheet.";
      setTimeout(() => { statusEl.textContent = ""; }, 3000);
      return;
    }
  } catch (e) {
    if (e && e.name === "AbortError") {
      statusEl.textContent = "";
      return;
    }
  }

  try {
    const url = URL.createObjectURL(currentBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    statusEl.textContent = "Downloaded — or press and hold the image above to save it.";
    setTimeout(() => { statusEl.textContent = ""; }, 3000);
  } catch (e) {
    statusEl.textContent = "Press and hold the image above and tap \"Save Image\".";
  }
}

document.getElementById("downloadBtn").addEventListener("click", handleGenerate);
document.getElementById("shareBtn").addEventListener("click", handleShare);

buildList();
updateProgress();
</script>
